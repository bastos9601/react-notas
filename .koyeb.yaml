# Configuración de Koyeb para el Sistema de Gestión de Notas
# Despliegue usando Dockerfiles para backend y frontend

services:
  # Servicio Backend (FastAPI)
  backend:
    type: web
    build:
      type: dockerfile
      dockerfile_path: backend/Dockerfile
    env:
      - name: SECRET_KEY
        value: "cambia-esto-en-produccion"
      # Importante: Define DATABASE_URL en el panel de Koyeb (PostgreSQL gestionado)
      # Ejemplo: postgresql://usuario:password@host:5432/sistema_notas?sslmode=require
    ports:
      - port: 8000
        http:
          paths:
            - path: /
              port: 8000
    healthcheck:
      http:
        path: /
        port: 8000
      initial_delay: 30s
      interval: 10s
      timeout: 5s
      retries: 3

  # Servicio Frontend (React)
  frontend:
    type: web
    build:
      type: dockerfile
      dockerfile_path: frontend/Dockerfile
    env:
      - name: REACT_APP_API_URL
        value: "https://TU_BACKEND_URL.koyeb.app"  # Actualiza tras desplegar backend
      - name: PORT
        value: "3001"
    ports:
      - port: 3001
        http:
          paths:
            - path: /
              port: 3001
    healthcheck:
      http:
        path: /
        port: 3001
      initial_delay: 30s
      interval: 10s
      timeout: 5s
      retries: 3
